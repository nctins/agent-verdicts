              required: [id]
              properties:
                id: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", description: "Slug; immutable"}
                name: {type: string, description: "1-100 characters, no control characters; trimmed; defaults to the id"}
                description: {type: string, description: "At most 500 characters, no control characters except newline"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectMeta"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/projects/{id}:
