openapi: 3.1.0
info:
  title: Agent Verdicts API
  version: 0.1.0-beta
  description: |
    JSON API behind the web UI (spec 2026-11-12-backend-rebuild, section 8).
    Source of truth for shapes is the implementation in
    `internal/adapter/httpapi`; `contract_test.go` holds the handlers to this
    file (routes in both directions, plus every request and response of a
    scenario that touches every route).

    Authentication: a browser logs in with `POST /session` and then carries
    the `av_session` cookie. Every non-GET request except `POST /session` and
    `POST /setup` also carries `X-CSRF-Token` (from `GET /session`). Those two
    session-less POSTs require an `Origin` header whose host equals the request
    host (403 otherwise).

    Access control (spec 2026-11-14-access-control): every route except
    `GET/POST /session` and `POST /setup` needs a session. What a caller may
    do comes from role assignments (actor + role + every project or one); a
    project the caller cannot read answers 404 as if it did not exist; a
    missing action is 403.

    Responses are never cacheable (`Cache-Control: no-store`). Timestamps are
    RFC 3339 UTC. Unknown JSON fields in a request body are rejected with 400.
servers:
  - url: /api/v1

tags:
  - {name: session}
  - {name: contributions}
  - {name: admin}

paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Who the cookie belongs to (public)
      responses:
        "200": {description: The current session or an anonymous one, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [session]
      operationId: login
      summary: Log in with username and password
      description: Five recent failures for a username give 429 without the password being checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200":
          description: Logged in; sets the session cookie
          headers: {Set-Cookie: {$ref: "#/components/headers/SetCookie"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [session]
      operationId: logout
      summary: Log out; clears the session cookie
      security: [{cookieAuth: [], csrfToken: []}]
      responses:
        "204": {description: Logged out, headers: {Set-Cookie: {$ref: "#/components/headers/SetCookie"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /setup:
    post:
      tags: [session]
      operationId: setup
      summary: First-run setup - create the first admin and log in
      description: Guarded by the one-time code the server prints to its log. 404 once setup is closed or was never open. 409 when the username or the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, username, password]
              properties:
                code: {type: string}
                name: {type: string, maxLength: 64}
                username: {type: string, description: "3-32 characters of a-z, 0-9, '.', '_' or '-' (case-insensitive input)"}
                password: {type: string, minLength: 10, maxLength: 128}
      responses:
        "201":
          description: Admin created and logged in
          headers: {Set-Cookie: {$ref: "#/components/headers/SetCookie"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/Internal"}

  /account/password:
    post:
      tags: [session]
      operationId: changePassword
      summary: Change your own password (allowed while a temporary one is in place)
      description: A wrong current password is a 400, not a login failure. Your other sessions end.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 10, maxLength: 128}
      responses:
        "204": {description: Changed}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects:
    get:
      tags: [contributions]
      operationId: listProjects
      summary: Every project the caller may read, with its counts, sorted by id; archived ones are included and flagged
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Projects, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectList"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions:
    parameters:
      - {$ref: "#/components/parameters/Project"}
    get:
      tags: [contributions]
      operationId: listContributions
      summary: One page of a project's contributions (contribution:Read); an unknown project is 404
      security: [{cookieAuth: []}]
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContributionKind"}}
        - name: state
          in: query
          description: Repeatable; matches any of the given states.
          schema: {type: array, items: {$ref: "#/components/schemas/TrustState"}}
        - name: question_status
          in: query
          description: Repeatable; questions only.
          schema: {type: array, items: {$ref: "#/components/schemas/QuestionStatus"}}
        - {name: actor, in: query, description: "Only this actor's contributions; `me` is the caller. When it names the caller, the caller's own hidden contributions are included, flagged `hidden`.", schema: {type: string}}
        - {name: since, in: query, description: "RFC 3339 timestamp: only contributions whose updated_at is after it.", schema: {type: string, format: date-time}}
        - {name: sort, in: query, description: "Default newest; active is updated_at descending.", schema: {type: string, enum: [newest, debated, least, active]}}
        - {name: cursor, in: query, description: "A next_cursor from a previous page of the same sort.", schema: {type: string}}
        - {name: limit, in: query, description: "Default 20.", schema: {type: integer}}
        - {name: include_superseded, in: query, description: "Default false: claims a newer claim replaced are left out. The server also accepts 1 and 0.", schema: {type: boolean}}
      responses:
        "200": {description: A page, content: {application/json: {schema: {$ref: "#/components/schemas/ContributionPage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [contributions]
      operationId: createContribution
      summary: Create a claim or question (contribution:Create); an unknown project is 404
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, title]
              properties:
                kind: {$ref: "#/components/schemas/ContributionKind"}
                title: {type: string, description: "1-200 characters after trimming"}
                body: {type: string, description: "At most 65536 bytes; may be empty"}
                answers_id: {type: string, description: "A claim only: the question it answers"}
                sources: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 500}, description: "Optional evidence: up to 10 items of 1-500 characters after trimming, no control characters (a URL, commit id or file path)"}
                supersedes_id: {type: string, description: "A claim only: a claim of the same project this one replaces. The caller must be its author or hold content:Moderate; the old claim must not be superseded already (409). Set atomically with the insert."}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/CreatedContribution"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
    get:
      tags: [contributions]
      operationId: getContribution
      summary: One contribution in full with its signals (contribution:Read); a hidden one is 404 unless the caller holds content:Moderate or wrote it
      security: [{cookieAuth: []}]
      responses:
        "200": {description: The contribution, content: {application/json: {schema: {$ref: "#/components/schemas/ContributionDetail"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}/signals:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
    post:
      tags: [contributions]
      operationId: createSignal
      summary: Challenge or assess a claim (signal:Create)
      description: |
        A new assessment replaces the same actor's earlier one; replaced_stance then holds the earlier stance.
        A challenge is `unfavorable` or `neutral`; `favorable` is 400 ("to support a claim with an argument, use an assessment with a body").
        With `reply_to` the signal is a reply: a challenge with stance `neutral` that answers a signal of the same claim.
        Replying to a reply stores the root signal. A `reply_to` that names no active signal on this claim (unknown, on another claim, withdrawn, hidden from the caller) is 400.
        Replies count as neutral signals, so they never change the state.
        A favorable signal from the claim's own author is saved but not counted toward the state; the result then carries `not_counted: true`.
        A signal on a claim that a newer claim replaced is still accepted; the result then carries `superseded_by` so the sender can move to the newer claim.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, stance]
              properties:
                kind: {type: string, enum: [challenge, assessment]}
                stance: {$ref: "#/components/schemas/Stance"}
                body: {type: string, description: "At most 65536 bytes; required (non-empty) for a challenge"}
                reply_to: {type: string, description: "ID of the signal being answered; challenge with stance neutral only"}
                sources: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 500}, description: "Optional evidence: up to 10 items of 1-500 characters after trimming, no control characters (a URL, commit id or file path)"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, actor_id, actor_name, replaced_stance]
                properties:
                  id: {type: string}
                  actor_id: {type: string}
                  actor_name: {type: string}
                  replaced_stance:
                    description: Stance of the assessment this one replaced, else null
                    oneOf:
                      - {$ref: "#/components/schemas/Stance"}
                      - {type: "null"}
                  superseded_by:
                    type: object
                    description: Present when the claim has been replaced by a newer claim (omitted when that claim is hidden from the caller)
                    additionalProperties: false
                    required: [id, title]
                    properties:
                      id: {type: string}
                      title: {type: string}
                  not_counted:
                    type: boolean
                    enum: [true]
                    description: "Present when the caller wrote the claim and this is a favorable signal: it is kept but does not count toward the trust state"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}/signals/{sid}:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/SignalId"}
    delete:
      tags: [contributions]
      operationId: withdrawSignal
      summary: Withdraw your own signal (signal:Create); it stops counting and cannot be restored
      description: Withdrawing twice is a no-op. Only the signal's author may withdraw it (403 otherwise). The signal stays visible in `history` with `withdrawn`.
      security: [{cookieAuth: [], csrfToken: []}]
      responses:
        "204": {description: Withdrawn}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}/signals/{sid}/hidden:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/SignalId"}
    put:
      tags: [contributions]
      operationId: setSignalHidden
      summary: Hide or unhide a signal (content:Moderate)
      description: A hidden signal is absent for callers without content:Moderate and does not count; moderators see it in `history` with `hidden` and, when one was given, `hidden_reason`.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody: {$ref: "#/components/requestBodies/Hidden"}
      responses:
        "204": {description: Done}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}/hidden:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
    put:
      tags: [contributions]
      operationId: setContributionHidden
      summary: Hide or unhide a contribution (content:Moderate)
      description: |
        Without content:Moderate a hidden contribution is absent from lists and search and a direct read is 404. Hiding a question does not hide its answers.
        Its author is the exception: they can still read it, and a list filtered by `actor` = themselves includes it, both with `hidden` and `hidden_reason`. Search never returns it to them.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody: {$ref: "#/components/requestBodies/Hidden"}
      responses:
        "204": {description: Done}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/contributions/{id}/supersession:
    parameters:
      - {$ref: "#/components/parameters/Project"}
      - {$ref: "#/components/parameters/Id"}
    delete:
      tags: [contributions]
      operationId: deleteSupersession
      summary: Undo a supersession (the claim's author, or content:Moderate)
      description: A claim that is not superseded is left alone (204).
      security: [{cookieAuth: [], csrfToken: []}]
      responses:
        "204": {description: Undone}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/reads:
    parameters:
      - {$ref: "#/components/parameters/Project"}
    get:
      tags: [contributions]
      operationId: getReads
      summary: How often agents read the project's contributions over MCP (member:Manage)
      description: |
        Counts successful observe_trust_signal and reference_contribution calls and contributions shown in search results; never the author's own reads, and never web reads. Days are UTC.
        Days older than `detail_from` are rolled up into monthly totals: `daily` lists the days that still have detail, `monthly` the rolled-up months that overlap the range. No field names or counts actors.
      security: [{cookieAuth: []}]
      parameters:
        - {name: from, in: query, description: "First day, YYYY-MM-DD; default 29 days before `to`", schema: {type: string, format: date}}
        - {name: to, in: query, description: "Last day, YYYY-MM-DD; default today (UTC)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Read counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [from, to, detail_days, detail_from, daily, monthly, items, never_read]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  detail_days: {type: integer, minimum: 30, maximum: 3650, description: Days of daily detail the project keeps}
                  detail_from: {type: string, format: date, description: Oldest day that keeps daily detail once the daily rollup has run}
                  daily:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [day, observe, reference, search_hit]
                      properties:
                        day: {type: string, format: date}
                        observe: {type: integer}
                        reference: {type: integer}
                        search_hit: {type: integer}
                  monthly:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [month, observe, reference, search_hit]
                      properties:
                        month: {type: string, format: date, description: First day of the month}
                        observe: {type: integer}
                        reference: {type: integer}
                        search_hit: {type: integer}
                  items:
                    type: array
                    description: Every contribution read in the range, most observed first
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, title, kind, state, superseded, observe, reference, search_hit]
                      properties:
                        id: {type: string}
                        title: {type: string}
                        kind: {type: string, enum: [claim, question]}
                        state: {$ref: "#/components/schemas/NullableTrustState"}
                        superseded: {type: boolean}
                        observe: &readCount
                          type: object
                          additionalProperties: false
                          required: [reads, readers]
                          properties:
                            reads: {type: integer}
                            readers: {type: integer, description: "Distinct actors; where the range reaches rolled-up months this is an upper bound (monthly readers are added)"}
                        reference: *readCount
                        search_hit:
                          type: object
                          additionalProperties: false
                          required: [reads]
                          properties:
                            reads: {type: integer}
                  never_read: {type: integer, description: "Live claims (not superseded, not hidden) with no observe or reference in the range"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/reads/retention:
    parameters:
      - {$ref: "#/components/parameters/Project"}
    put:
      tags: [contributions]
      operationId: setReadRetention
      summary: How many days of daily read detail the project keeps (member:Manage)
      description: Lowering it rolls the excess into monthly totals within a day; raising it only keeps more from now on.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [detail_days]
              properties:
                detail_days: {type: integer, minimum: 30, maximum: 3650}
      responses:
        "200":
          description: Stored, with the detail size it implies
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [detail_days, estimated_bytes, rows_per_day]
                properties:
                  detail_days: {type: integer}
                  estimated_bytes: {type: integer, description: "rows_per_day × detail_days × 170 bytes"}
                  rows_per_day: {type: number, description: "Daily rows written, averaged over the last 30 days"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/authors:
    parameters:
      - {$ref: "#/components/parameters/Project"}
    get:
      tags: [contributions]
      operationId: listAuthors
      summary: Everyone who wrote a contribution in the project (contribution:Read)
      description: Sorted by name, then id. Authors whose only contributions are hidden from the caller are left out.
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Authors
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name]
                      properties:
                        id: {type: string, description: "Usable as the `actor` filter of the list"}
                        name: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /projects/{p}/search:
    parameters:
      - {$ref: "#/components/parameters/Project"}
    get:
      tags: [contributions]
      operationId: searchContributions
      summary: Search a project's contributions (contribution:Read)
      security: [{cookieAuth: []}]
      description: |
        degraded is true when a configured embedding or rerank step failed and the answer fell back to a simpler ranking.
        Common Vietnamese function words (là, thì, của, bao nhiêu, …) are dropped from the lexical query unless nothing else is left.
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContributionKind"}}
        - name: state
          in: query
          description: Repeatable; claims in any of these states. Applied before the limit, so up to `limit` matching results come back. Same rules as on the list.
          schema: {type: array, items: {$ref: "#/components/schemas/TrustState"}}
        - name: question_status
          in: query
          description: Repeatable; questions with any of these statuses. Applied before the limit. With both parameters the result is the union of the two groups.
          schema: {type: array, items: {$ref: "#/components/schemas/QuestionStatus"}}
        - {name: limit, in: query, description: "Default 5, at most 20.", schema: {type: integer}}
        - {name: rerank, in: query, description: "Default true. The server also accepts 1 and 0.", schema: {type: boolean}}
        - {name: include_superseded, in: query, description: "Default false: claims a newer claim replaced are left out. The server also accepts 1 and 0.", schema: {type: boolean}}
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results, degraded]
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/SearchItem"}}
                  degraded: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      summary: Totals plus the newest contributions across projects (actor:Manage or member:Manage)
      description: Over the projects the caller may read; for a caller without actor:Manage (a project manager), only over the projects it holds member:Manage on.
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project_count, contribution_count, open_question_count, states, recent, attention]
                properties:
                  attention:
                    type: object
                    description: What to look at, over the same projects as the totals
                    additionalProperties: false
                    required: [conflicts_7d, stale_questions]
                    properties:
                      conflicts_7d: {type: integer, description: Claims in Conflict that changed in the last 7 days}
                      stale_questions: {type: integer, description: Questions still open 14 days after they were asked}
                  project_count: {type: integer}
                  contribution_count: {type: integer}
                  open_question_count: {type: integer}
                  states:
                    type: object
                    description: Claims per trust state; every state is present.
                    additionalProperties: false
                    required: [Favorable, Unfavorable, Conflict, InsufficientEvidence]
                    properties:
                      Favorable: {type: integer}
                      Unfavorable: {type: integer}
                      Conflict: {type: integer}
                      InsufficientEvidence: {type: integer}
                  recent:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [project_id, id, kind, title, state, created_at, updated_at, actor_name]
                      properties:
                        project_id: {type: string}
                        id: &listItemId {type: string}
                        kind: &listItemKind {$ref: "#/components/schemas/ContributionKind"}
                        title: &listItemTitle {type: string}
                        state: &listItemState {$ref: "#/components/schemas/NullableTrustState"}
                        question_status: &listItemQStatus {$ref: "#/components/schemas/QuestionStatus"}
                        answer_count: &listItemAnswers {type: integer, description: "Questions only: answers that are not hidden"}
                        counts: &listItemCounts {description: "Claims only", $ref: "#/components/schemas/Counts"}
                        created_at: &listItemCreated {type: string, format: date-time}
                        updated_at: &listItemUpdated {type: string, format: date-time, description: Creation or the newest signal}
                        actor_name: &listItemActorName {type: string}
                        actor_type: &listItemActorType {$ref: "#/components/schemas/ActorType"}
                        superseded: &listItemSuperseded {type: boolean, description: "Present (true) when a newer claim replaced it"}
                        hidden: &listItemHidden {type: boolean, description: "Present (true) for a moderator when it is hidden"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/actors:
    get:
      tags: [admin]
      operationId: listActors
      summary: Actors with their login summary (actor:Manage or member:Manage)
      description: |
        With actor:Manage: every actor. With only member:Manage: without `q`, the actors holding an assignment on a project the caller manages (an assignment on every project counts only if the caller manages every project); with `q`, at most 20 actors whose name contains it, so a manager can find someone to add. Managers do not see login details.
        `q` is matched against the name ignoring case and Vietnamese accents on both sides (`binh` finds `Bình`, `d` matches `đ`) and must have at least 2 characters after trimming (else 400). For actor:Manage it filters the full list without a cap.
      security: [{cookieAuth: []}]
      parameters:
        - {name: q, in: query, description: "Name contains this text, ignoring case and accents; at least 2 characters after trimming.", schema: {type: string}}
      responses:
        "200":
          description: Actors
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminActor"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [admin]
      operationId: createActor
      summary: Create a Human (with a login) or an Agent (with a token)
      description: The generated password or the token is returned once, only here. An Agent's first token expires after 90 days. Names are unique ignoring case; a taken name is 409.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name]
              properties:
                type: {$ref: "#/components/schemas/ActorType"}
                name: {type: string, maxLength: 64}
                username: {type: string, description: "Humans only, required for them"}
                password: {type: string, description: "Humans only; omit or empty to generate one"}
                must_change: {type: boolean, description: "Humans only: the password must be changed at first login"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, type, name, disabled, created_at, username, has_login, last_active_at, next_token_expiry]
                properties:
                  id: &actorId {type: string}
                  type: &actorType {$ref: "#/components/schemas/ActorType"}
                  name: &actorName {type: string}
                  disabled: &actorDisabled {type: boolean}
                  created_at: &actorCreated {type: string, format: date-time}
                  username: &actorUsername {type: [string, "null"]}
                  has_login: &actorHasLogin {type: boolean}
                  last_active_at: &actorLastActive {type: [string, "null"], format: date-time, description: "Latest password login or token use; null when none, or for a caller without actor:Manage"}
                  next_token_expiry: &actorNextExpiry {type: [string, "null"], format: date-time, description: "Earliest expiry of a live token; null when none, or for a caller without actor:Manage"}
                  password: {type: string, description: "Humans only, when no password was given (and also when one was); shown once"}
                  token: {type: string, description: "Agents only; shown once"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/actors/{id}:
    parameters:
      - {$ref: "#/components/parameters/Id"}
    get:
      tags: [admin]
      operationId: getActor
      summary: One actor with its credentials
      security: [{cookieAuth: []}]
      responses:
        "200": {description: The actor, content: {application/json: {schema: {$ref: "#/components/schemas/AdminActorDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    patch:
      tags: [admin]
      operationId: patchActor
      summary: Rename, grant or remove admin, disable or re-enable an actor
      description: Absent fields are unchanged. Only Humans can be admins; you cannot demote or disable yourself. Names are unique ignoring case; a taken name is 409.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                disabled: {type: boolean}
      responses:
        "200": {description: The updated actor, content: {application/json: {schema: {$ref: "#/components/schemas/AdminActorDetail"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/actors/{id}/password:
    parameters:
      - {$ref: "#/components/parameters/Id"}
    post:
      tags: [admin]
      operationId: resetPassword
      summary: Set or generate a Human's password
      description: Returned once. Resetting your own password never forces a change and keeps your session.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: {type: string, description: "Empty keeps the current username"}
                password: {type: string, description: "Empty generates one"}
                must_change: {type: boolean}
      responses:
        "200":
          description: The new password
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [password]
                properties:
                  password: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/actors/{id}/credentials:
    parameters:
      - {$ref: "#/components/parameters/Id"}
    post:
      tags: [admin]
      operationId: issueCredential
      summary: Issue an Agent a new token
      description: |
        The token is returned once. Humans get 400; they log in with a password.
        The body is optional. `expires_in_days` is 30, 90, 365 or null (never
        expires); when absent the token expires after **90 days**, after which
        MCP answers 401 until a new token is issued.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: {type: string, maxLength: 64, description: "A note shown next to the token; no control characters"}
                expires_in_days: {type: [integer, "null"], enum: [30, 90, 365, null], description: "Absent = 90; null = never expires"}
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, token, label, expires_at]
                properties:
                  id: {type: string, description: Credential id (the part of the token before the dot)}
                  token: {type: string}
                  label: {type: string}
                  expires_at: {type: [string, "null"], format: date-time, description: "Null: never expires"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/credentials/{id}:
    parameters:
      - {$ref: "#/components/parameters/Id"}
    delete:
      tags: [admin]
      operationId: revokeCredential
      summary: Revoke a credential (revoking twice is a no-op)
      security: [{cookieAuth: [], csrfToken: []}]
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: The log of administrative operations, newest first
      description: |
        actor:Manage sees every event. A caller with only member:Manage sees
        just the `assignment.*` and `content.*` events of the projects it
        manages. `detail` never holds a password, token, secret or hash.
      security: [{cookieAuth: []}]
      parameters:
        - {name: actor, in: query, description: "Only events by this actor id", schema: {type: string}}
        - {name: project, in: query, description: "Only events of this project", schema: {type: string}}
        - {name: action, in: query, description: "Only this exact action, e.g. credential.issue", schema: {type: string}}
        - {name: from, in: query, description: "Only events on or after this UTC day (YYYY-MM-DD)", schema: {type: string, format: date}}
        - {name: to, in: query, description: "Only events on or before this UTC day (YYYY-MM-DD)", schema: {type: string, format: date}}
        - {name: cursor, in: query, description: "A next_cursor from a previous page.", schema: {type: string}}
        - {name: limit, in: query, description: "Default 20, at most 100.", schema: {type: integer}}
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}
                  next_cursor: {type: [string, "null"], description: "Null on the last page"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

