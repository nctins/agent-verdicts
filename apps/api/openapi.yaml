  /admin/settings/search:
    get:
      tags: [admin]
      operationId: getSearchSettings
      summary: Embedding and rerank providers plus pipeline status (no API keys, only the last 4 characters)
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/Settings"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    put:
      tags: [admin]
      operationId: putSearchSettings
      summary: Test the providers, then save them
      description: |
        Nothing is saved when a provider test fails (502). Per provider,
        `api_key` absent or "" keeps the stored key, null deletes it, a
        string sets it.
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SettingsInput"}}}
      responses:
        "200": {description: Saved settings, content: {application/json: {schema: {$ref: "#/components/schemas/Settings"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/UpstreamFailed"}
        "500": {$ref: "#/components/responses/Internal"}

  /admin/settings/search/test:
    post:
      tags: [admin]
      operationId: testSearchSettings
      summary: Test the providers without saving anything
      security: [{cookieAuth: [], csrfToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SettingsInput"}}}
      responses:
        "204": {description: Both providers answered}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/UpstreamFailed"}
        "500": {$ref: "#/components/responses/Internal"}

