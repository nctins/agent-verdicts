      operationId: reindexSearch
      summary: Re-embed everything in the background
      security: [{cookieAuth: [], csrfToken: []}]
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reindexing]
                properties:
                  reindexing: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: av_session}
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token of GET /session; required on every non-GET request that needs a session.

  headers:
    SetCookie:
      description: Sets (or, on logout, clears) the HttpOnly, SameSite=Lax av_session cookie.
      schema: {type: string}

  parameters:
    Project: {name: p, in: path, required: true, description: "Project id, a slug", schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}}
    Id: {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
    SignalId: {name: sid, in: path, required: true, schema: {type: string, minLength: 1}}

  requestBodies:
    Hidden:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [hidden]
            properties:
              hidden: {type: boolean}
              reason: {type: string, maxLength: 500, description: "Optional, why it is hidden (trimmed; at most 500 characters). Kept only with hidden true; unhiding clears it. Hiding again without a reason keeps the stored one."}

  responses:
    BadRequest: {description: "invalid_argument: malformed or invalid input", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthenticated: {description: "unauthenticated: no live session, or wrong credentials", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: "forbidden: a missing action, missing CSRF token, cross-origin request, or a temporary password must be changed first", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: "not_found", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: "conflict: already exists, still in use, the last admin would lose admin rights, the claim is already superseded, or the project is archived (`project is archived`)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    TooManyRequests: {description: "too_many_requests: too many failed attempts", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    UpstreamFailed: {description: "upstream_failed: a search provider rejected or failed the test; nothing was saved", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Internal: {description: "internal: message is always 'internal error'", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, enum: [invalid_argument, unauthenticated, forbidden, not_found, conflict, too_many_requests, upstream_failed, internal]}
        message: {type: string}

    TrustState: {type: string, enum: [Favorable, Unfavorable, Conflict, InsufficientEvidence]}
    NullableTrustState:
      description: Null for questions
      oneOf:
        - {$ref: "#/components/schemas/TrustState"}
        - {type: "null"}
    ContributionKind: {type: string, enum: [claim, question]}
    QuestionStatus: {type: string, enum: [open, answered, resolved], description: "Questions only"}
    Stance: {type: string, enum: [favorable, unfavorable, neutral]}
    ActorType: {type: string, enum: [Human, Agent]}

    Actor:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id: {type: string}
        name: {type: string}
        type: {$ref: "#/components/schemas/ActorType"}

    Action:
      type: string
      enum: ["contribution:Read", "contribution:Create", "signal:Create", "content:Moderate", "member:Manage", "project:Create", "actor:Manage", "settings:Manage", "policy:Manage", "*"]
      description: '"*" (every action) appears only in the managed AdministratorAccess policy'
    Access:
      description: What the caller may do, for showing controls; the server checks every request.
      type: object
      additionalProperties: false
      required: [all, projects]
      properties:
        all: {type: array, items: {$ref: "#/components/schemas/Action"}, description: "Actions on every project; [\"*\"] for an admin"}
        projects: {type: object, additionalProperties: {type: array, items: {$ref: "#/components/schemas/Action"}}, description: "Extra actions per project id"}
    Policy:
      type: object
      additionalProperties: false
      required: [id, name, managed, actions, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        managed: {type: boolean, description: "Built in and read-only"}
        actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        created_at: {type: string, format: date-time}
    PolicyInput:
      type: object
      additionalProperties: false
      required: [name, actions]
      properties:
        name: {type: string, maxLength: 64}
        actions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Action"}, description: "Never \"*\"; each must be held by the caller on every project"}
    Role:
      type: object
      additionalProperties: false
      required: [id, name, managed, policy_ids, actions, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        managed: {type: boolean, description: "Built in and read-only"}
        policy_ids: {type: array, items: {type: string}}
        actions: {type: array, items: {$ref: "#/components/schemas/Action"}, description: "Union of the policies' actions"}
        created_at: {type: string, format: date-time}
    RoleInput:
      type: object
      additionalProperties: false
      required: [name, policy_ids]
      properties:
        name: {type: string, maxLength: 64}
        policy_ids: {type: array, minItems: 1, items: {type: string}, description: "Never AdministratorAccess"}
    Assignment:
      type: object
      additionalProperties: false
      required: [id, actor_id, actor_name, role_id, role_name, project_id, created_at]
      properties:
        id: {type: string}
        actor_id: {type: string}
        actor_name: {type: string}
        role_id: {type: string}
        role_name: {type: string}
        project_id: {type: [string, "null"], description: "Null = every project, including ones created later"}
        created_at: {type: string, format: date-time}

    Session:
      type: object
      additionalProperties: false
      required: [authenticated, actor, csrf_token, must_change_password, setup_required]
      properties:
        authenticated: {type: boolean}
        actor:
          oneOf: [{$ref: "#/components/schemas/Actor"}, {type: "null"}]
        csrf_token: {type: [string, "null"], description: "Null when anonymous"}
        must_change_password: {type: boolean}
        setup_required: {type: boolean, description: "First-run setup is still open (POST /setup)"}
        access: {$ref: "#/components/schemas/Access"}

    Created:
      type: object
      additionalProperties: false
      required: [id, actor_id, actor_name]
      properties:
        id: {type: string}
        actor_id: {type: string}
        actor_name: {type: string}

    CreatedContribution:
      description: The new contribution plus up to 3 existing ones with a similar title, searched (lexically) before it was saved. The question it answers (`answers_id`) and the claim it replaces (`supersedes_id`) are never listed.
      type: object
      additionalProperties: false
      required: [id, actor_id, actor_name, similar]
      properties:
        id: {type: string}
        actor_id: {type: string}
        actor_name: {type: string}
        similar: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/SearchItem"}}

    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Project"}}
    ProjectMeta:
      type: object
      additionalProperties: false
      required: [id, name, description, min_favorable, created_at, archived]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        min_favorable: {type: integer, minimum: 1, maximum: 10}
        created_at: {type: string, format: date-time}
        archived: {type: boolean}
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, min_favorable, contribution_count, open_question_count, last_activity_at, states, created_at, archived]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        min_favorable: {type: integer, minimum: 1, maximum: 10}
        contribution_count: {type: integer}
        open_question_count: {type: integer}
        last_activity_at: {type: [string, "null"], format: date-time, description: "Newest updated_at (creation or newest signal) of the project's contributions that are not hidden, superseded ones included; null when there are none"}
        states:
          type: object
          description: Claims per trust state; every state is present.
          additionalProperties: false
          required: [Favorable, Unfavorable, Conflict, InsufficientEvidence]
          properties:
            Favorable: {type: integer}
            Unfavorable: {type: integer}
            Conflict: {type: integer}
            InsufficientEvidence: {type: integer}
        created_at: {type: string, format: date-time}
        archived: {type: boolean}

    ContributionItem:
      description: One row of a contribution list.
      type: object
      additionalProperties: false
      required: [id, kind, title, state, created_at, updated_at, actor_name, actor_id]
      properties:
        id: *listItemId
        kind: *listItemKind
        title: *listItemTitle
        state: *listItemState
        question_status: *listItemQStatus
        answer_count: *listItemAnswers
        counts: *listItemCounts
        created_at: *listItemCreated
        updated_at: *listItemUpdated
        actor_name: *listItemActorName
        actor_type: *listItemActorType
        superseded: *listItemSuperseded
        hidden: {type: boolean, description: "Present (true) when it is hidden: for a moderator, or for the author listing their own (actor = themselves)"}
        hidden_reason: &hiddenReason {type: string, description: "Present when it is hidden and the moderator gave a reason"}
        actor_id: {type: string}
    ContributionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ContributionItem"}}
        next_cursor: {type: [string, "null"], description: "Null on the last page"}

    SearchItem:
      description: |
        A search hit. For questions `state` is null and question_status,
        answer_count and (when answered) best_answer_state are present; for
        claims those three are omitted.
      type: object
      additionalProperties: false
      required: [id, kind, title, snippet, state]
      properties:
        id: {type: string}
        kind: {$ref: "#/components/schemas/ContributionKind"}
        title: {type: string}
        snippet: {type: string}
        state: {$ref: "#/components/schemas/NullableTrustState"}
        question_status: {$ref: "#/components/schemas/QuestionStatus"}
        answer_count: {type: integer}
        best_answer_state: {$ref: "#/components/schemas/TrustState"}
        superseded: {type: boolean, description: "Present (true) when a newer claim replaced it (only found with include_superseded)"}
        hidden: {type: boolean, description: "Present (true) for a moderator when it is hidden"}
        hidden_reason: *hiddenReason

    Reference:
      description: |
        One contribution in full, with its signals. Claims have counts (and
        answer_to when they answer a question); questions have
        question_status, answer_count, answers and, once answered,
        best_answer_state, and a null state.
      type: object
      additionalProperties: false
      required: [id, project_id, kind, title, body, sources, actor_id, actor_name, created_at, state, signals]
      properties:
        id: {type: string}
        project_id: {type: string}
        kind: {$ref: "#/components/schemas/ContributionKind"}
        title: {type: string}
        body: {type: string}
        sources: {type: array, items: {type: string}, description: "Evidence references given by the author"}
        actor_id: {type: string}
        actor_name: {type: string}
        actor_type: {$ref: "#/components/schemas/ActorType"}
        created_at: {type: string, format: date-time}
        state: {$ref: "#/components/schemas/NullableTrustState"}
        question_status: {$ref: "#/components/schemas/QuestionStatus"}
        answer_count: {type: integer}
        best_answer_state: {$ref: "#/components/schemas/TrustState"}
        counts: {$ref: "#/components/schemas/Counts"}
        min_favorable: {type: integer, description: "Claims only: different supporters (counts.favorable_actors) the project needs for Favorable"}
        answers:
          type: array
          description: Questions only, best state first
          items:
            type: object
            additionalProperties: false
            required: [id, title, state]
            properties:
              id: {type: string}
              title: {type: string}
              state: {$ref: "#/components/schemas/NullableTrustState"}
              hidden: {type: boolean, description: "Present (true) for a moderator when the answer is hidden"}
              hidden_reason: *hiddenReason
        answer_to:
          type: object
          description: Claims that answer a question only
          additionalProperties: false
          required: [id, title]
          properties:
            id: {type: string}
            title: {type: string}
        signals: {$ref: "#/components/schemas/Signals"}
        superseded_by:
          type: object
          description: A claim a newer claim replaced; the newer claim (omitted when it is hidden from the caller)
          additionalProperties: false
          required: [id, title]
          properties:
            id: {type: string}
            title: {type: string}
        hidden: {type: boolean, description: "Present (true) for a moderator or the author when the contribution is hidden"}
        hidden_reason: *hiddenReason
    ContributionDetail: {$ref: "#/components/schemas/Reference"}

    Counts:
      type: object
      additionalProperties: false
      required: [favorable, unfavorable, neutral, favorable_actors]
      properties:
        favorable: {type: integer, description: "Active favorable signals, not counting the claim's author"}
        unfavorable: {type: integer}
        neutral: {type: integer}
        favorable_actors: {type: integer, description: "Distinct actors other than the author with an active favorable signal; compared with min_favorable"}

    Signal:
      type: object
      additionalProperties: false
      required: [id, kind, stance, actor_id, actor_name, body, sources, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [challenge, assessment]}
        stance: {$ref: "#/components/schemas/Stance"}
        actor_id: {type: string}
        actor_name: {type: string}
        actor_type: {$ref: "#/components/schemas/ActorType"}
        body: {type: string}
        sources: {type: array, items: {type: string}, description: "Evidence references given by the sender"}
        created_at: {type: string, format: date-time}
        reply_to: {type: string, description: "Present on a reply: the ID of the top-level signal it answers (replies are one level deep)"}
        superseded: {type: boolean, description: "Present (true) only in history"}
        withdrawn: {type: boolean, description: "Present (true) only in history: the author took it back"}
        hidden: {type: boolean, description: "Present (true) only in history, and only for a moderator"}
        hidden_reason: *hiddenReason
        actor_disabled: {type: boolean, description: "Present (true) only in history: its sender is disabled"}
    Signals:
      description: A claim's signals; all groups are empty for a question.
      type: object
      additionalProperties: false
      required: [favorable, unfavorable, neutral, history]
      properties:
        favorable: {type: array, items: {$ref: "#/components/schemas/Signal"}}
        unfavorable: {type: array, items: {$ref: "#/components/schemas/Signal"}}
        neutral: {type: array, items: {$ref: "#/components/schemas/Signal"}}
        history: {type: array, description: "Signals that do not count toward state: replaced, withdrawn, hidden (moderators only) or from a disabled actor", items: {$ref: "#/components/schemas/Signal"}}

    AdminActor:
      type: object
      additionalProperties: false
      required: [id, type, name, disabled, created_at, username, has_login, last_active_at, next_token_expiry]
      properties:
        id: *actorId
        type: *actorType
        name: *actorName
        disabled: *actorDisabled
        created_at: *actorCreated
        username: *actorUsername
        has_login: *actorHasLogin
        last_active_at: *actorLastActive
        next_token_expiry: *actorNextExpiry
    AdminActorDetail:
      description: An admin actor plus its credentials (listed for every actor, so older tokens stay revocable).
      type: object
      additionalProperties: false
      required: [id, type, name, disabled, created_at, username, has_login, last_active_at, next_token_expiry, credentials, assignments]
      properties:
        id: *actorId
        type: *actorType
        name: *actorName
        disabled: *actorDisabled
        created_at: *actorCreated
        username: *actorUsername
        has_login: *actorHasLogin
        last_active_at: *actorLastActive
        next_token_expiry: *actorNextExpiry
        credentials: {type: array, items: {$ref: "#/components/schemas/Credential"}}
        assignments: {type: array, items: {$ref: "#/components/schemas/Assignment"}}
    Credential:
      type: object
      additionalProperties: false
      required: [id, created_at, revoked_at, label, expires_at, last_used_at]
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        label: {type: string, description: "Empty for tokens issued without one"}
        expires_at: {type: [string, "null"], format: date-time, description: "Null: never expires"}
        last_used_at: {type: [string, "null"], format: date-time, description: "Null: never used; updated at most once a minute"}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, at, actor_id, actor_name, action, target_type, target_id, project_id, detail]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor_id: {type: [string, "null"], description: "Null: the operator CLI"}
        actor_name: {type: string, description: "Empty for the CLI"}
        action:
          type: string
          description: "actor.create|rename|disable|enable|password_reset, credential.issue|revoke, assignment.create|delete, role.create|update|delete, policy.create|update|delete, project.create|update, settings.search.update|reindex, setup.complete, content.hide|unhide"
        target_type: {type: string, description: "actor, credential, assignment, role, policy, project, settings, contribution or signal"}
        target_id: {type: string}
        project_id: {type: [string, "null"]}
        detail: {type: object, additionalProperties: true, description: "Non-secret facts about the operation"}

    ProviderView:
      type: object
      additionalProperties: false
      required: [url, model, api_key_last4]
      properties:
        url: {type: string, description: "Empty when the provider is off"}
        model: {type: string}
        api_key_last4: {type: string, description: "Last 4 characters of the stored key, or empty"}
    Settings:
      type: object
      additionalProperties: false
      required: [embedding, rerank, status]
      properties:
        embedding:
          type: object
          additionalProperties: false
          required: [url, model, api_key_last4, dim]
          properties:
            url: {type: string}
            model: {type: string}
            api_key_last4: {type: string}
            dim: {type: integer, description: "Vector dimension detected at the last successful test; 0 when off"}
        rerank: {$ref: "#/components/schemas/ProviderView"}
        status: {$ref: "#/components/schemas/Status"}
    Status:
      type: object
      additionalProperties: false
      required: [pipeline, embedded_count, total_count, reindexing, warnings]
      properties:
        pipeline: {type: string, description: "bm25, optionally followed by +vector and +rerank"}
        embedded_count: {type: integer}
        total_count: {type: integer}
        reindexing: {type: boolean}
        warnings: {type: array, items: {type: string}, description: "Machine-readable codes, e.g. api_key_unreadable:embedding"}
    ProviderInput:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, description: "Empty turns the provider off"}
        model: {type: string}
        api_key:
          type: [string, "null"]
          description: Absent or "" keeps the stored key, null deletes it, a string sets it.
    SettingsInput:
      type: object
      additionalProperties: false
      properties:
        embedding: {$ref: "#/components/schemas/ProviderInput"}
        rerank: {$ref: "#/components/schemas/ProviderInput"}
