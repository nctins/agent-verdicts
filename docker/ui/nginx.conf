map $http_x_forwarded_proto $av_proto { default $http_x_forwarded_proto; "" $scheme; }

# Cache-Control by path, set once at server level so every location inherits the same
# security headers (a location with its own add_header would drop them all).
# Empty = not added: api and mcp responses keep their own caching.
map $uri $av_cache {
    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~^/api/          "";
    ~^/mcp/          "";
    default          "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Resolve api per request via Docker's DNS: nginx starts without api, and follows
    # a recreated api to its new address. A variable in proxy_pass forces this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    add_header Cache-Control $av_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # ponytail: 'unsafe-inline' for scripts because the Next.js static export inlines
    # bootstrap scripts; drop it by emitting CSP hashes at build time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $av_proto;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass $api;
    }
    # Bare /mcp: let the api answer 404 with its hint; without this nginx would 301 to /mcp/.
    location = /mcp {
        proxy_pass $api;
    }
    location /mcp/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # A proxy_set_header here drops every inherited one, so repeat them.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $av_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /_next/static/ {
        try_files $uri =404;
    }
    # /p/<project>/ and /p/<project>/c/<id>/ are one static page (apps/ui/app/p) that reads the path.
    # The client router fetches that page's RSC files under the real path: serve /p's copies.
    location ~ ^/p/.+/((?:__next\.[^/]*|index)\.txt)$ {
        try_files $uri /p/$1 =404;
    }
    location /p/ {
        try_files $uri $uri/index.html /p/index.html;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
