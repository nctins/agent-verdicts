root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/agentverdicts ./cmd/agentverdicts"
bin = "./tmp/agentverdicts"
include_ext = ["go", "html", "json", "sql"]
exclude_dir = ["tmp", "scripts"]
delay = 300
kill_delay = "2s"
send_interrupt = true
stop_on_error = true
# Docker Desktop bind mounts (macOS/Windows) do not reliably propagate inotify
# events; polling is the documented Air workaround.
poll = true
poll_interval = 500

[log]
time = true

[misc]
clean_on_exit = false
