name: agentverdicts
services:
  db:
    image: ${IMAGE_PREFIX:-}agentverdicts-db:${VERSION:?set VERSION in .env}
    environment:
      POSTGRES_DB: agentverdicts
      POSTGRES_USER: agentverdicts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "agentverdicts", "-d", "agentverdicts"], interval: 2s, retries: 30 }
    restart: unless-stopped
  api:
    image: ${IMAGE_PREFIX:-}agentverdicts-api:${VERSION}
    command: ["serve"]
    environment:
      AGENTVERDICTS_DATABASE_URL: postgres://agentverdicts:${POSTGRES_PASSWORD}@db:5432/agentverdicts
      AGENTVERDICTS_LOGIN_LOCKOUT: ${LOGIN_LOCKOUT:-}
    volumes: [api-secrets:/secrets]
    # No ports: only ui reaches api. X-Real-IP from nginx is trusted only because of this.
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  ui:
    image: ${IMAGE_PREFIX:-}agentverdicts-ui:${VERSION}
    ports: ["${PORT:-8080}:8080"]
    depends_on: [api]
    restart: unless-stopped
  embed:
    profiles: ["ai"]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.4}
    platform: ${TEI_PLATFORM:-linux/amd64}
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "2048"]
    volumes: [hf-cache:/data]
    restart: unless-stopped
  rerank:
    profiles: ["ai"]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.4}
    platform: ${TEI_PLATFORM:-linux/amd64}
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--max-batch-tokens", "2048"]
    volumes: [hf-cache:/data]
    restart: unless-stopped
volumes: { db-data: {}, api-secrets: {}, hf-cache: {} }
